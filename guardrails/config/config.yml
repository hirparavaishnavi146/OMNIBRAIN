models:
  - type: main
    engine: openai
    model: gemini-3.6-flash

rails:
  input:
    flows:
      - check topic relevance

  output:
    flows:
      - check grounding
      - check response scope

instructions:
  - type: general
    content: |
      You are a precise document analysis assistant for the OmniBrain system.
      You must ONLY answer questions based on the provided document context.
      Never use your general knowledge to answer questions.
      If the context does not contain enough information, say so explicitly.
      Always cite your sources with inline references like [1], [2].

sample_conversation: |
  user "What are the Q3 revenue figures?"
    ask about document
  bot "Based on the document, the Q3 revenue was $5.2M [1]."
    inform answer from document
  user "What is the meaning of life?"
    ask off topic
  bot "I can only answer questions about the uploaded document. This question is outside the scope of the document."
    refuse off topic
